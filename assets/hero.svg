<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0D1117"/>
    <stop offset="50%" stop-color="#17122A"/>
    <stop offset="100%" stop-color="#1F1147"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED">
      <animate attributeName="stop-color" values="#7C3AED;#6366F1;#A855F7;#7C3AED" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#6366F1"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1280" height="400" rx="24" fill="url(#bg)"/>

